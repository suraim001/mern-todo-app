services:


  # 1. Backend Service
  backend:
    build: ./backend
    container_name: mern-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env

  # 2. Frontend Service
  frontend:
    build: ./frontend
    container_name: mern-frontend
    ports:
      - "3000:80"  # Maps local port 3000 to container Nginx port 80
    depends_on:
      - backend
